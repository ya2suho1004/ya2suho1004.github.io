<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube 연동 이용약관</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav aria-label="YouTube 연동 메뉴">
    <a href="index.html">소개</a>
    <a href="privacy.html">개인정보처리방침</a>
    <a href="terms.html" aria-current="page">이용약관</a>
  </nav>
  <main>
  <header>
    <h1>이용약관</h1>
    <p class="lead">Hermes Social Insights는 채널 소유자가 관리하는 개인용 YouTube 연동입니다.</p>
  </header>
  <section aria-labelledby="use">
    <h2 id="use">사용 조건</h2>
    <p>이 연동을 사용하면 YouTube 서비스 약관에 동의하게 됩니다. 채널 소유자는 본인이 관리할 권한이 있는 채널을 연결하고, <a href="privacy.html">개인정보처리방침</a>을 확인한 후 접근 권한을 부여합니다.</p>
    <p><a href="https://www.youtube.com/t/terms">YouTube 서비스 약관</a></p>
  </section>
  <section aria-labelledby="stop">
    <h2 id="stop">연동 중지</h2>
    <p>Hermes의 관련 자동화를 중지하고, Google 계정의 접근 권한 관리에서 연동을 해제할 수 있습니다.</p>
    <p><a href="https://security.google.com/settings/security/permissions">Google 계정 접근 권한 관리</a></p>
  </section>
  </main>
</body>
</html>
